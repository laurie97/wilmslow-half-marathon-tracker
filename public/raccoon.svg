<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Running raccoon">
  <title>Running raccoon</title>
  <!-- speed lines -->
  <g stroke="#9ca2aa" stroke-width="2" stroke-linecap="round">
    <line x1="2" y1="34" x2="8" y2="34"/>
    <line x1="4" y1="40" x2="12" y2="40"/>
    <line x1="3" y1="46" x2="8" y2="46"/>
  </g>
  <!-- ground shadow -->
  <ellipse cx="33" cy="60" rx="17" ry="2" fill="#1d2125" opacity="0.1"/>
  <!-- ringed tail -->
  <path d="M22 38 C14 36 10 30 9 22" fill="none" stroke="#8c939b" stroke-width="9" stroke-linecap="round"/>
  <path d="M22 38 C14 36 10 30 9 22" fill="none" stroke="#3a3f45" stroke-width="9" stroke-dasharray="3.5 4" stroke-dashoffset="-3"/>
  <circle cx="9" cy="21.5" r="4.5" fill="#3a3f45"/>
  <!-- far legs -->
  <path d="M34 44 L40 50 L46 49" fill="none" stroke="#5d646c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M38 34 L33 39" fill="none" stroke="#5d646c" stroke-width="4.5" stroke-linecap="round"/>
  <!-- body -->
  <ellipse cx="31" cy="38" rx="12" ry="9.5" transform="rotate(-18 31 38)" fill="#8c939b"/>
  <g transform="rotate(-18 32 39)">
    <rect x="26" y="35" width="12" height="9" rx="1.5" fill="#fff" stroke="#c4c8ce" stroke-width="0.6"/>
    <text x="32" y="42" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="6" fill="#2f5d62">21</text>
  </g>
  <!-- near legs -->
  <path d="M26 44 L20 51 L14 51" fill="none" stroke="#8c939b" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="13.5" cy="51" r="3" fill="#3a3f45"/>
  <path d="M40 34 L46 37 L50 34" fill="none" stroke="#8c939b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="50.5" cy="33.5" r="2.7" fill="#3a3f45"/>
  <circle cx="46.5" cy="49" r="2.7" fill="#3a3f45"/>
  <!-- ears -->
  <ellipse cx="38" cy="12" rx="4" ry="5" transform="rotate(-25 38 12)" fill="#3a3f45"/>
  <ellipse cx="38.5" cy="13" rx="2" ry="2.8" transform="rotate(-25 38.5 13)" fill="#e9ebee"/>
  <ellipse cx="49" cy="11" rx="4" ry="5" transform="rotate(20 49 11)" fill="#3a3f45"/>
  <ellipse cx="48.8" cy="12" rx="2" ry="2.8" transform="rotate(20 48.8 12)" fill="#e9ebee"/>
  <!-- head -->
  <circle cx="44" cy="22" r="11" fill="#8c939b"/>
  <ellipse cx="45" cy="26" rx="9" ry="6.5" fill="#e9ebee"/>
  <!-- bandit mask -->
  <path d="M34.5 20 C38 16 42 18 45 20 C48 18 52 16 55 20 C54 25 49 25 45 23 C41 25 36 25 34.5 20 Z" fill="#3a3f45"/>
  <circle cx="40.5" cy="20.5" r="2.2" fill="#fff"/>
  <circle cx="41" cy="20.8" r="1.2" fill="#1d2125"/>
  <circle cx="49.5" cy="20.5" r="2.2" fill="#fff"/>
  <circle cx="50" cy="20.8" r="1.2" fill="#1d2125"/>
  <!-- nose, smile, cheeks -->
  <ellipse cx="45" cy="26.2" rx="2.2" ry="1.6" fill="#1d2125"/>
  <path d="M43 28.8 Q45 30.6 47 28.8" fill="none" stroke="#1d2125" stroke-width="1" stroke-linecap="round"/>
  <circle cx="38.5" cy="26.5" r="1.6" fill="#f2a7a0" opacity="0.8"/>
  <circle cx="51.5" cy="26.5" r="1.6" fill="#f2a7a0" opacity="0.8"/>
  <!-- headband -->
  <path d="M34 15.5 Q44 9.5 54 15" fill="none" stroke="#2f5d62" stroke-width="2.6" stroke-linecap="round"/>
</svg>
