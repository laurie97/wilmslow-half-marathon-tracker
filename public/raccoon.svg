<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Ralph the running raccoon">
  <title>Ralph the running raccoon</title>
  <!-- speed lines -->
  <g stroke="#9ca2aa" stroke-width="2" stroke-linecap="round">
    <line x1="2" y1="34" x2="8" y2="34" />
    <line x1="4" y1="40" x2="12" y2="40" />
    <line x1="3" y1="46" x2="8" y2="46" />
  </g>
  <!-- ground shadow -->
  <ellipse cx="33" cy="60" rx="17" ry="2" fill="#1d2125" opacity="0.1" />
  <!-- ringed tail -->
  <path d="M22 38 C14 36 10 30 9 22" fill="none" stroke="#7a7470" stroke-width="9" stroke-linecap="round" />
  <path d="M22 38 C14 36 10 30 9 22" fill="none" stroke="#4a4441" stroke-width="9" stroke-dasharray="3.5 4" stroke-dashoffset="-3" />
  <circle cx="9" cy="21.5" r="4.5" fill="#4a4441" />
  <!-- far legs -->
  <path d="M34 44 L40 50 L46 49" fill="none" stroke="#625c58" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M38 34 L33 39" fill="none" stroke="#625c58" stroke-width="4.5" stroke-linecap="round" />
  <!-- far shoe -->
  <g transform="translate(48.5 48.4) scale(1.25) rotate(-8)">
    <path d="M-4 0.9 Q-4.3 -3.1 -1 -3.4 L0.6 -1.6 Q4.4 -1.4 5 0.9 Z" fill="#c9472f" />
    <rect x="-4.6" y="0.5" width="10.2" height="2" rx="1" fill="#fff" stroke="#c4c8ce" stroke-width="0.5" />
    <path d="M-1.6 -2.2 L-0.4 -1 M0.2 -2.4 L1.2 -1.2" stroke="#fff" stroke-width="0.7" stroke-linecap="round" />
  </g>
  <!-- body -->
  <ellipse cx="31" cy="38" rx="12" ry="9.5" transform="rotate(-18 31 38)" fill="#7a7470" />
  <g transform="rotate(-18 32 39)">
    <rect x="26" y="35" width="12" height="9" rx="1.5" fill="#fff" stroke="#c4c8ce" stroke-width="0.6" />
    <text x="32" y="42" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="6" fill="#2f5d62">21</text>
  </g>
  <!-- near legs, shoe and paw -->
  <path d="M26 44 L20 51 L14 51" fill="none" stroke="#7a7470" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" />
  <!-- near shoe -->
  <g transform="translate(12.5 50.4) scale(-1.3 1.3) rotate(-12)">
    <path d="M-4 0.9 Q-4.3 -3.1 -1 -3.4 L0.6 -1.6 Q4.4 -1.4 5 0.9 Z" fill="#f2643b" />
    <rect x="-4.6" y="0.5" width="10.2" height="2" rx="1" fill="#fff" stroke="#c4c8ce" stroke-width="0.5" />
    <path d="M-1.6 -2.2 L-0.4 -1 M0.2 -2.4 L1.2 -1.2" stroke="#fff" stroke-width="0.7" stroke-linecap="round" />
  </g>
  <path d="M40 34 L46 37 L50 34" fill="none" stroke="#7a7470" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="50.5" cy="33.5" r="2.7" fill="#514a46" />
  <!-- ears -->
  <circle cx="35.5" cy="13.5" r="4.6" fill="#8a837e" />
  <circle cx="35.8" cy="13.8" r="2.7" fill="#e6dfd9" />
  <circle cx="52.5" cy="13.5" r="4.6" fill="#8a837e" />
  <circle cx="52.2" cy="13.8" r="2.7" fill="#e6dfd9" />
  <!-- head -->
  <circle cx="44" cy="22.5" r="11.5" fill="#7a7470" />
  <!-- cream eyebrows curving round the eye patches -->
  <g fill="none" stroke="#ece5df" stroke-width="3" stroke-linecap="round">
    <path d="M35.6 26.5 Q34.6 17.8 41.6 17.4" />
    <path d="M52.4 26.5 Q53.4 17.8 46.4 17.4" />
  </g>
  <!-- eye patches and eyes -->
  <ellipse cx="40.2" cy="22.8" rx="3.5" ry="4.6" transform="rotate(22 40.2 22.8)" fill="#524b47" />
  <ellipse cx="47.8" cy="22.8" rx="3.5" ry="4.6" transform="rotate(-22 47.8 22.8)" fill="#524b47" />
  <circle cx="41.3" cy="22" r="1.35" fill="#111" />
  <circle cx="46.7" cy="22" r="1.35" fill="#111" />
  <circle cx="41.7" cy="21.6" r="0.45" fill="#fff" />
  <circle cx="47.1" cy="21.6" r="0.45" fill="#fff" />
  <!-- snout, nose and mouth -->
  <circle cx="44" cy="28" r="5.4" fill="#ece5df" />
  <path d="M41.4 25.3 Q44 24 46.6 25.3 Q46.2 28 44 28.9 Q41.8 28 41.4 25.3 Z" fill="#4b2a24" />
  <path d="M44 28.9 L44 30.3 M42.6 30.8 Q44 31.6 45.4 30.8" fill="none" stroke="#4b2a24" stroke-width="0.8" stroke-linecap="round" />
</svg>
